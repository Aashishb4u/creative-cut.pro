# Creative Cut behind an nginx that already serves other sites on this server.
#
# 1. In .env on the server, remove the COMPOSE_PROFILES=own-https line (Creative Cut then listens only on
#    127.0.0.1:8765 and leaves ports 80 and 443 to nginx).
# 2. Copy this file to /etc/nginx/sites-available/creativecut, replace the domain and the two certificate paths,
#    link it into sites-enabled, then:  nginx -t && systemctl reload nginx
#
# CREATIVECUT_TRUST_PROXY is already on in the Docker image, so Creative Cut reads the visitor's address from the
# X-Forwarded-For header set below.

server {
    listen 80;
    listen [::]:80;
    server_name creativecut.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creativecut.example.com;

    ssl_certificate     /etc/ssl/creativecut/fullchain.pem;
    ssl_certificate_key /etc/ssl/creativecut/privkey.pem;

    # every request is small, so a low cap keeps junk out
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
